# Kong AI Gateway data plane (Konnect) + Grafana Alloy, for a Coolify "Docker Compose" resource.
# Set the variables below in Coolify → resource → Environment Variables.
services:
  kong-dp:
    image: kong/kong-ai-gateway:2.2.0-distroless
    restart: unless-stopped
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_VITALS: "off"
      KONG_KONNECT_MODE: "on"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: c0b1bf91b1.us.cp.konghq.com:443
      KONG_CLUSTER_SERVER_NAME: c0b1bf91b1.us.cp.konghq.com
      KONG_CLUSTER_TELEMETRY_ENDPOINT: c0b1bf91b1.us.tp.konghq.com:443
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: c0b1bf91b1.us.tp.konghq.com
      KONG_CLUSTER_CERT: ${KONG_CLUSTER_CERT:?paste the Konnect data plane certificate}
      KONG_CLUSTER_CERT_KEY: ${KONG_CLUSTER_CERT_KEY:?paste the Konnect data plane private key}
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_STATUS_LISTEN: 0.0.0.0:8100
      KONG_TLS_CERTIFICATE_VERIFY: ${KONG_TLS_CERTIFICATE_VERIFY:-on}
      # Coolify routes the public domain to this port
      SERVICE_FQDN_KONG_8000: ""
    expose:
      - "8000"
      - "8100"

  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    depends_on: [kong-dp]
    environment:
      KONG_TARGET: kong-dp:8100
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:?}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:?}
      GRAFANA_PROM_TOKEN: ${GRAFANA_PROM_TOKEN:?}
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - type: bind
        source: ./config.alloy
        target: /etc/alloy/config.alloy
        content: |
          prometheus.scrape "kong" {
            targets = [{ __address__ = sys.env("KONG_TARGET"), job = "kong", instance = "coolify" }]
            scrape_interval = "15s"
            forward_to = [prometheus.remote_write.grafana_cloud.receiver]
          }
          prometheus.remote_write "grafana_cloud" {
            endpoint {
              url = sys.env("GRAFANA_PROM_URL")
              basic_auth {
                username = sys.env("GRAFANA_PROM_USER")
                password = sys.env("GRAFANA_PROM_TOKEN")
              }
            }
          }
